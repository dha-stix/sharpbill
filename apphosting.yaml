# Firebase App Hosting configuration (https://firebase.google.com/docs/app-hosting/configure)
# App Hosting builds this Next.js app from GitHub and runs it on Cloud Run.

runConfig:
  # Keep costs low: scale to zero when idle, cap the number of instances.
  minInstances: 0
  maxInstances: 2
  memoryMiB: 512
  concurrency: 80

env:
  # Firebase web app config. These values are public by design (they ship to the
  # browser); data access is protected by firestore.rules, not by hiding them.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyB6iuWsaH3SGw90li-dsAw-SXCra9UdM_c"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "sharpbill-2b40a.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "sharpbill-2b40a"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "sharpbill-2b40a.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "155189697106"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:155189697106:web:22905c09bbb715693fdd8b"
    availability:
      - BUILD
      - RUNTIME

  # Public URL of the live site: used for social share images, sitemap and robots.txt.
  # Set this to your App Hosting URL (or custom domain) after the first rollout, then push again.
  # - variable: NEXT_PUBLIC_SITE_URL
  #   value: "https://YOUR-BACKEND--YOUR-PROJECT.us-central1.hosted.app"
  #   availability:
  #     - BUILD
  #     - RUNTIME
